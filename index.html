<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Raasta — 3D experience launching soon</title>
  <meta name="description" content="Business Raasta: find trusted local businesses near you in India. Our new 3D website is launching soon." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center;
      background: radial-gradient(1200px 600px at 50% -10%, #2b3a8f 0%, transparent 60%), #070b1a;
    }
    h1 { font-size: clamp(28px, 6vw, 56px); margin: 0 0 12px; letter-spacing: -0.02em; }
    p { margin: 0 auto; max-width: 560px; opacity: .8; font-size: clamp(15px, 2.4vw, 18px); line-height: 1.6; }
    .road { width: min(420px, 80vw); height: 6px; margin: 32px auto 0; border-radius: 99px;
      background: linear-gradient(90deg, transparent, #ffb347, #ff6a3d, transparent);
      background-size: 200% 100%; animation: move 2.4s linear infinite; }
    @keyframes move { from { background-position: 200% 0; } to { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) { .road { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Business Raasta</h1>
    <p>Find trusted local businesses near you in India. Our new, fully 3D website is being built and will be here soon.</p>
    <div class="road" aria-hidden="true"></div>
  </main>
</body>
</html>
